name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          # Cambiamos el cache a pnpm
          cache: "pnpm"

      - name: Instalar pnpm globalmente
        run: npm install -g pnpm

      - name: Instalar dependencias con pnpm
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar EAS CLI globalmente
        run: pnpm install -g eas-cli

      - name: Login a Expo
        run: npx expo login --non-interactive --token ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK localmente
        run: |
          eas build --platform android --local --profile preview --output=app.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-android
          path: app.apk
          retention-days: 7
