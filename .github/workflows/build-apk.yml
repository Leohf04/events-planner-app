name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Definir packageManager
        run: |
          npm pkg set packageManager=pnpm@8.15.9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Verificar pnpm
        run: pnpm --version

      - name: Cache de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Actualizar dependencias de Expo
        run: |
          npx expo install --fix

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar EAS CLI globalmente
        run: pnpm install -g eas-cli

      - name: Construir APK localmente (optimizado)
        run: |
          export GRADLE_OPTS="-Xmx3072m -XX:MaxMetaspaceSize=512m"
          eas build --platform android --local --profile preview --output=app.apk --non-interactive --max-workers 2
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-android
          path: app.apk
          retention-days: 7