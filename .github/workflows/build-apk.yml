name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar pnpm (con acción oficial)
        uses: pnpm/action-setup@v2
        with:
          version: 8 # Puedes usar la versión que tengas en tu proyecto

      - name: Obtener directorio de almacenamiento de pnpm
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias con pnpm
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar EAS CLI globalmente
        run: pnpm install -g eas-cli

      - name: Login a Expo
        run: npx expo login --non-interactive --token ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK localmente
        run: |
          eas build --platform android --local --profile preview --output=app.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-android
          path: app.apk
          retention-days: 7
