name: Build Android APK (Local EAS)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # 1. Definir el packageManager en package.json (evita que Corepack intervenga)
      - name: Definir packageManager
        run: |
          npm pkg set packageManager=pnpm@8.15.9

      # 2. Configurar Node.js 18
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Instalar pnpm (acción oficial, más fiable)
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9  # Versión estable reciente

      # 4. Verificar que pnpm está disponible
      - name: Verificar pnpm
        run: pnpm --version

      # 5. Cache de pnpm (acelera)
      - name: Cache de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 6. Instalar dependencias sin congelar el lockfile (por si hay diferencias de versión)
      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar EAS CLI globalmente
        run: pnpm install -g eas-cli

      - name: Login a Expo
        run: npx expo login --non-interactive --token ${{ secrets.EXPO_TOKEN }}

      - name: Construir APK localmente
        run: |
          eas build --platform android --local --profile preview --output=app.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-android
          path: app.apk
          retention-days: 7